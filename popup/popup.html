<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ScramAutoBuild</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="top">
    <div class="brand"><img src="../icons/icon48.png" alt="" />ScramAutoBuild</div>
    <button id="settings" class="icon" type="button" title="Settings">⚙</button>
  </header>

  <!-- Needs you: shown only when the run is waiting for you -->
  <section id="needs" class="needs hidden" role="alert">
    <div id="needsTitle" class="needs-title"></div>
    <p id="needsText"></p>
    <div id="needsActions" class="actions"></div>
  </section>

  <section class="card">
    <div class="row between">
      <span class="label">Current run</span>
      <span id="runBadge" class="badge">idle</span>
    </div>
    <div id="runEmpty" class="muted">Nothing running. Start a site or category clone from the Control Center.</div>
    <div id="run" class="hidden">
      <div id="runName" class="run-name"></div>
      <div id="track" class="track" aria-hidden="true"></div>
      <div id="stage" class="stage"></div>
      <div id="runMsg" class="muted msg"></div>
      <div id="runStats" class="stats"></div>
      <div class="actions">
        <button id="pause" class="small" type="button">⏸ Pause</button>
        <button id="resume" class="small primary" type="button">▶ Resume</button>
        <button id="stop" class="small" type="button">■ Stop</button>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="row between">
      <span class="label">Control Center</span>
      <span id="ccBadge" class="badge">not connected</span>
    </div>
    <div class="actions">
      <button id="openCc" class="primary" type="button">Open Control Center ↗</button>
      <button id="ccSettings" type="button">Connection settings</button>
    </div>
  </section>

  <footer>
    <button id="devMode" class="ghost block" type="button">🛠 Switch to Dev mode (full side panel)</button>
  </footer>

  <div id="toast" class="toast hidden"></div>
  <script src="popup.js" type="module"></script>
</body>
</html>
