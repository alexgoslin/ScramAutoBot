<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ScramAutoBuild</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="shell">
  <header class="top">
    <div class="brand"><img src="../icons/icon48.png" alt="" />ScramAutoBuild</div>
    <button id="settings" class="icon" type="button" title="Settings">⚙</button>
  </header>

  <section class="card cc-card">
    <div class="row between">
      <span class="label">Control Center</span>
      <span id="ccBadge" class="badge">not connected</span>
    </div>
    <div class="cc-actions">
      <button id="openCc" class="primary" type="button">Open Control Center ↗</button>
      <button id="ccSettings" class="link" type="button">Connection settings</button>
    </div>
  </section>

  <!-- Needs you: shown only when the run is waiting for you -->
  <section id="needs" class="needs hidden" role="alert">
    <div id="needsTitle" class="needs-title"></div>
    <p id="needsText" class="needs-text"></p>
    <button id="needsMore" class="more hidden" type="button">Show more</button>
    <div class="actions"><span id="needsQuick" class="actions"></span><button id="needsGo" class="primary" type="button">Open Control Center ↗</button></div>
  </section>

  <section class="card run-card">
    <div class="row between">
      <span class="label">Current run</span>
      <span id="runBadge" class="badge">idle</span>
    </div>
    <div id="runEmpty" class="empty">
      <div class="empty-icon" aria-hidden="true">🌱</div>
      <div>Nothing running yet.<br /><span class="muted">Start a site or category clone from the Control Center.</span></div>
    </div>
    <div id="run" class="run hidden">
      <div id="runName" class="run-name"></div>
      <div class="progress">
        <div class="row between">
          <span id="stage" class="stage"></span>
          <span id="stageNo" class="stage-no"></span>
        </div>
        <div id="track" class="track" aria-hidden="true"></div>
      </div>
      <div id="runMsg" class="msg"></div>
      <div id="runStats" class="stats"></div>
    </div>
  </section>


  <footer>
    <button id="devMode" class="dev" type="button">Switch to Dev mode <span class="muted">· full side panel</span></button>
  </footer>

  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="popup.js" type="module"></script>
</body>
</html>
